<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Pclip Extension</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0D0D0D;
      color: #E2E2E2;
      margin: 0;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 8px;
      margin-bottom: 12px;
      background-color: #1A1A1A;
      color: #FFF;
      border: 1px solid #333;
      border-radius: 6px;
      resize: none;
      box-sizing: border-box;
      font-family: monospace;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    .success {
      color: #4ade80 !important;
    }

    .error {
      color: #ef4444 !important;
    }

    .link-out {
      display: block;
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #3b82f6;
      text-decoration: none;
    }

    .link-out:hover {
      text-decoration: underline;
    }

    #dropZone {
      border: 2px dashed #444;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
      color: #888;
      transition: all 0.2s;
      cursor: pointer;
    }

    #dropZone.dragover {
      border-color: #3b82f6;
      background-color: rgba(59, 130, 246, 0.1);
      color: #fff;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h1 style="margin: 0;">
      <img src="icons/icon16.png" width="16" height="16" alt="logo">
      Pclip
    </h1>
    <div id="authStatus" style="font-size: 12px; color: #888;">
      Checking...
    </div>
  </div>
  <textarea id="clipText" placeholder="Paste text or code here to save to your cloud clipboard..."></textarea>

  <div id="dropZone">
    Drag & drop a file here<br>or click to browse
    <input type="file" id="fileInput">
  </div>

  <button id="saveBtn">Save to Pclip</button>
  <div id="status"></div>
  <a href="https://drive.io/clipboard" target="_blank" class="link-out">Open My Clipboard &rarr;</a>

  <script src="popup.js"></script>
</body>

</html>
